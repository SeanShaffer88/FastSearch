# Canonical CI for Sean's Rust Windows projects — copy to
# .github/workflows/ci.yml. NOTE: the GitHub App cannot create/edit files
# under .github/workflows/ (no Workflows permission), so this file is
# always added through the GitHub web UI.
#
# Steps mirror tools/gate.sh exactly, plus the one thing a local gate on
# Linux cannot do: really LINK and RUN on Windows (LNK2019-class errors
# and Windows-only test failures only appear here).
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - run: python tests/ffi_load_smoke.py target/release/fast_search.dll
      - run: python tests/ffi_diff_smoke.py target/release/fast_search.dll
      - name: Set up native C compiler
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      - name: Standalone C and Python consumers
        shell: pwsh
        run: |
          cl /nologo /W4 /WX /I include examples/search.c target/release/fast_search.dll.lib /Fe:target/release/c_consumer.exe
          if ($LASTEXITCODE -ne 0) { throw 'C consumer compile failed' }
          New-Item -ItemType Directory -Force target/consumer-fixture | Out-Null
          Set-Content target/consumer-fixture/sample.txt 'Synthetic fixture'
          $result = & target/release/c_consumer.exe target/consumer-fixture
          if ($LASTEXITCODE -ne 0 -or $result -notmatch 'sample.txt') { throw 'C consumer failed' }
          python examples/search.py target/release/fast_search.dll target/consumer-fixture
          if ($LASTEXITCODE -ne 0) { throw 'Python consumer failed' }
